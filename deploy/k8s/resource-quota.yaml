apiVersion: v1
kind: ResourceQuota
metadata:
  name: smart-factory-workloads
spec:
  hard:
    pods: "40"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "24"
    limits.memory: 24Gi
    services: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: smart-factory-container-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
