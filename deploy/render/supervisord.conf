[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/smart-factory-supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/smart-factory-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/smart-factory-supervisor.sock

[program:device]
directory=/services/device
command=dotnet DeviceService.dll
environment=ASPNETCORE_URLS="http://127.0.0.1:3102",ASPNETCORE_HTTP_PORTS="3102",PORT="3102"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telemetry]
directory=/services/telemetry
command=dotnet TelemetryService.dll
environment=PORT="3103",ASPNETCORE_HTTP_PORTS="3103"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
directory=/app
command=node server/_core/index.mjs
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:identity]
directory=/services/identity
command=dotnet IdentityService.dll
environment=ASPNETCORE_URLS="http://127.0.0.1:3104",ASPNETCORE_HTTP_PORTS="3104",PORT="3104"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:analytics]
directory=/services/analytics
command=dotnet AnalyticsService.dll
environment=ASPNETCORE_URLS="http://127.0.0.1:3105",ASPNETCORE_HTTP_PORTS="3105",PORT="3105"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:notification]
directory=/services/notification
command=dotnet NotificationService.dll
environment=ASPNETCORE_URLS="http://127.0.0.1:3106",ASPNETCORE_HTTP_PORTS="3106",PORT="3106"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
